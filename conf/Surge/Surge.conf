[Rule]
# 基础直连：优先处理局域网、IPv6 ULA 和系统请求，避免扫描后续大型规则集
RULE-SET,LAN,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
RULE-SET,SYSTEM,DIRECT // 系统请求
# 国内媒体PCDN拦截
